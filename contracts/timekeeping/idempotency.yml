# Idempotency rules shared by all three Timekeeping contracts
# (docs/architecture/timekeeping-soa.md section 5.1).
# Same key and body returns the same answer; same key with a new body answers
# idempotency_key_reused; a key or operation id from another company or actor
# never matches. One exception: a prepare replayed after its operation ended
# returns the operation's terminal state, not the first prepared answer
# (see key_sources.reservations).
name: idempotency
source: docs/architecture/timekeeping-soa.md section 5.1

receipt_scope: [company_scope, actor_type, actor_id, operation, key]
# The least time a receipt is kept, not an expiry: a stored receipt keeps
# answering replays until it is removed.
retention_hours: 24
# Only successful answers are stored, so a retry after an error, a 409
# included, is evaluated again.
stored_statuses: 2xx

key_sources:
  entry_api:
    key: Idempotency-Key header
    company_scope: the path company_id
  reservations:
    key: operation_id in the body
    company_scope: the path company_id
    # Prepare answers from the stored operation record, not from a receipt.
    # A replayed prepare returns the operation's current state, so after
    # commit or abort it answers committed or aborted (reservations.yml
    # rules.terminal_prepare). The record is kept with no 24-hour limit.
    # Commit, abort, mark-billed and detach-entries use ordinary receipts.
    prepare_answer: the stored operation record, with its current state
  entry_snapshots:
    key: Idempotency-Key header
    company_scope: the sorted set of company_id values in the batch's entries

errors:
  key_reused:
    status: 422
    body: { reason: idempotency_key_reused }
