# The reference read Timekeeping makes before a background write
# (docs/architecture/timekeeping-soa.md section 3.4). The monolith serves it;
# every key list here is exact.
name: reference
source: docs/architecture/timekeeping-soa.md section 3.4
schema_version: 1

routes:
  show:
    method: GET
    path: /internal/v1/companies/{company_id}/reference
    query: "project_ids=1,2, agent_ids=3,4 and invoice_ids=5,6 (each a comma-separated list or an array; absent means none)"

headers:
  authorization: "Authorization: Bearer <TIMEKEEPING_SERVICE_TOKEN>"
  cache_control: "Cache-Control: no-store"

max_project_ids: 200
max_agent_ids: 200
max_invoice_ids: 200

# owned_agent_ids and invoices are additive: a reader that does not ask about
# agents or invoices ignores them. Deploy the monolith before a Timekeeping
# that reads them, and roll Timekeeping back first.
response_fields: [company_id, edit_days, users, projects, missing_project_ids, agents, owned_agent_ids, invoices]
user_fields: [id, role]
project_fields: [id, company_id, billable, member_user_ids]
agent_fields: [id, user_id]
invoice_fields: [id, company_id]

rules:
  service_identity: Only the Timekeeping service token is accepted. A missing or wrong credential, or a user token, gets 401 and no data, whether or not the company exists.
  company_scope: >-
    Every fact belongs to the company in the path. Users are the company's
    employed users, with their role in that company. Agents are every agent of
    the company, active or not, each with only its id and the user it belongs
    to, so Timekeeping can check design rule S7 before an entry write.
  missing_project: A requested project the company does not own is listed in missing_project_ids exactly like an id that does not exist, with none of its facts.
  owned_agents: >-
    owned_agent_ids lists the requested agent_ids that are agents of the
    company in the path, read without a row lock, so an agent whose deletion
    holds its row lock is still listed (agents leaves it out). Another
    company's agent is left out exactly like an id no agent has. With no
    agent_ids the list is empty.
  owned_invoices: >-
    invoices lists, as {id, company_id}, the requested invoice_ids that are
    invoices of the company in the path, discarded ones included, or that the
    company holds only as an invoice operation intent (a new invoice whose save
    has not committed yet, or a deleted invoice). Another company's invoice or
    intent is left out exactly like an id no invoice has. With no invoice_ids
    the list is empty.

errors:
  unauthorized:
    status: 401
    body: { reason: unauthorized }
  not_found:
    status: 404
    body: { reason: not_found }
  invalid_project_ids:
    status: 422
    body: { reason: invalid_project_ids }
  invalid_agent_ids:
    status: 422
    body: { reason: invalid_agent_ids }
  invalid_invoice_ids:
    status: 422
    body: { reason: invalid_invoice_ids }
