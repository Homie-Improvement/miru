# The Timekeeping entry API (docs/architecture/timekeeping-soa.md section 5.2).
# Callers act for a user: the acting user comes from the signed bearer token,
# never from the request body.
name: entry_api
source: docs/architecture/timekeeping-soa.md section 5.2

routes:
  create:
    method: POST
    path: /v1/companies/{company_id}/entries
  update:
    method: PATCH
    path: /v1/companies/{company_id}/entries/{entry_id}
  destroy:
    method: DELETE
    path: /v1/companies/{company_id}/entries/{entry_id}
  show:
    method: GET
    path: /v1/companies/{company_id}/entries/{entry_id}
  index:
    method: GET
    path: /v1/companies/{company_id}/entries
    query: [from, to, user_id, project_id]
  bulk_move:
    method: POST
    path: /v1/companies/{company_id}/entries/bulk-move
  bulk_delete:
    method: POST
    path: /v1/companies/{company_id}/entries/bulk-delete

headers:
  authorization: "Authorization: Bearer <signed user token>"
  idempotency_key: "Idempotency-Key: <uuid>"
  ownership_generation: "Ownership-Generation: <n>"
  if_match: "If-Match: <version>"
  # Optional. The monolith request a call was made for, so a forwarded write
  # and the lookup before it can be traced to the same monolith request.
  x_request_id: "X-Request-Id: <monolith request id>"
  # Optional, DELETE only. See rules.replay_only.
  idempotency_replay: "Idempotency-Replay: only"

# Claims the provider reads from the signed bearer token. purpose is "read"
# or "write"; a token signed for reads is refused on every write route.
# primary_role is the user's lowest-id role in the company; the locked-entry
# and billed-change rules decide on it, and on role when a token has none.
token_claims: [sub, company_id, role, primary_role, purpose]
privileged_roles: [owner, admin]

request:
  entry_required_fields: [project_id, work_date, duration, note, source, source_metadata]
  entry_optional_fields: [user_id, bill_status, agent_id, proof_url, proof_metadata]
  bulk_move_fields: [entry_ids, project_id]
  bulk_delete_fields: [entry_ids]

response:
  # Every entry body field, plus the provider-owned fields.
  entry_fields:
    - id
    - company_id
    - version
    - project_id
    - user_id
    - work_date
    - duration
    - note
    - bill_status
    - review_status
    - source
    - source_metadata
    - agent_id
    - proof_url
    - proof_metadata
    - locked
  index_fields: [entries]
  bulk_fields: [results]
  bulk_result_fields: [entry_id, result]
  bulk_results: [moved, deleted, not_found]

rules:
  locked: true exactly when the entry has a reservation, provisional or committed.
  duration: a JSON number holding the stored float unchanged, never converted or rounded.
  target_user: >-
    The body's user_id names the entry's target user, not the acting user.
    An owner or admin may name a user of the same company; a user of another
    company answers not_found. An employee may name only themselves; any other
    user answers forbidden. A missing user_id means the acting user.
  company_mismatch: An entry or user of another company answers not_found, exactly as a missing id does.
  agent_owner: >-
    A create or update must leave the entry with no agent, or with an agent of
    the entry's company whose user is the entry's user, checked on the agent
    and user the entry holds after the write. Any other agent_id (one that
    does not exist, another company's agent, or a colleague's agent) answers
    not_found, exactly as a missing id does, and changes nothing.
  stale_generation: A stale Ownership-Generation answers stale_generation and changes nothing; on a bulk route it fails the whole request.
  destroy: DELETE discards the entry and returns it; a later GET answers not_found.
  replay_only: >-
    A DELETE carrying Idempotency-Replay: only is answered only from the
    receipt stored for the same company, acting user, entry and
    Idempotency-Key: the stored answer is replayed. With no such receipt it
    answers not_found and changes nothing; it never discards an entry. The
    caller also sends If-Match: replay-only, a value that never matches a
    version, so a provider that does not read the header still replays a
    stored receipt or refuses with version_conflict, and never discards.
    Every other route, and any other header value, ignores the header.
  credential_in_body: >-
    A write whose body holds, anywhere, a credential the provider issued or
    holds (a user token or a service identity) answers credential_in_body and
    changes nothing, so no snapshot can carry it.

errors:
  unauthorized:
    status: 401
    body: { reason: unauthorized }
  not_found:
    status: 404
    body: { reason: not_found }
  forbidden:
    status: 403
    body: { reason: forbidden }
  stale_generation:
    status: 409
    body: { reason: stale_generation }
  version_conflict:
    status: 409
    body: { reason: version_conflict }
  credential_in_body:
    status: 422
    body: { reason: credential_in_body }
