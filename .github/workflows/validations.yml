name: CI Test Suite
on:
  push:
    branches: [develop, main, stable-3-0, production]
  pull_request:
    branches: [develop, main, production]
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

# Cancel in-progress runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Every job pins ubuntu-24.04: ruby/setup-ruby has no prebuilt Ruby 4.0.1
# (.ruby-version) for ubuntu-26.04, which ubuntu-latest now resolves to.
jobs:
  tests:
    name: Running tests
    runs-on: ubuntu-24.04  # Standard 2-core runner
    # The Timekeeping handoff specs reload the two-tenant seed in every example
    # group, so they run in the timekeeping-handoff job instead of here; left
    # in, they kept one parallel process running up to this limit.
    timeout-minutes: 60
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: root
      DB_PASS: password
      CI: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: miru_web_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d miru_web_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            node_modules/.cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Restore parallel runtime log cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: ${{ runner.os }}-parallel-rspec-runtime-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-parallel-rspec-runtime-${{ github.ref_name }}-
            ${{ runner.os }}-parallel-rspec-runtime-

      - name: Install pnpm packages
        run: |
          PUPPETEER_SKIP_DOWNLOAD=true pnpm install --frozen-lockfile

      - name: Build Vite assets (sanity)
        env:
          SECRET_KEY_BASE: dummy
        run: |
          timeout 180 bin/vite build

      - name: Run Rubocop
        run: bundle exec rubocop

      - name: Run ESLint
        run: pnpm lint

      - name: Run JS unit tests
        run: pnpm test:js

      - name: Setup test database
        run: |
          bundle exec rake "parallel:create[2]" "parallel:load_schema[2]"

      - name: Run parallel tests (excluding system specs)
        env:
          PARALLEL_TEST_PROCESSORS: 2  # Optimal for standard runners
          PARALLEL_RUNTIME_LOG: tmp/parallel_runtime_rspec.log
          PARALLEL_FAILURES_LOG: tmp/failing_specs.txt
        run: |
          mkdir -p tmp
          bin/parallel_test -n 2 --exclude-system --exclude-dir spec/lib/timekeeping/handoff

          # Save failed specs list for debugging
          if [ -f tmp/failing_specs.txt ]; then
            echo "Failed specs:"
            cat tmp/failing_specs.txt
          fi

      # A cancelled or timed-out run can leave a partial runtime log; caching it
      # would make the next run fall back to splitting spec files by size.
      - name: Save parallel runtime log cache
        if: ${{ !cancelled() && hashFiles('tmp/parallel_runtime_rspec.log') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: ${{ runner.os }}-parallel-rspec-runtime-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            tmp/rspec_*.xml
            tmp/rspec*.xml
            tmp/capybara/*.png
            tmp/failing_specs.txt
            tmp/parallel_runtime_rspec.log
            log/test.log
          if-no-files-found: warn

  # The handoff specs reload the two-tenant seed in every example group, and run
  # one after another they outgrew one job's one-hour limit. They run here,
  # beside Running tests, split by parallel_tests into three groups of spec
  # files, one group per matrix leg. Every leg splits the same files the same
  # way (by file size), so the legs together run each file exactly once.
  # timekeeping-handoff-result reports the legs as one check.
  timekeeping-handoff:
    name: Timekeeping handoff specs, group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    strategy:
      # Let every group finish so one failure does not hide another.
      fail-fast: false
      matrix:
        # Must list 1 to the -n passed to parallel_rspec below.
        group: [1, 2, 3]
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: root
      DB_PASS: password
      CI: true
      # The handoff specs render no pages, so they need no Vite build (and this job installs no Node).
      SKIP_VITE_TEST_BUILD: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: miru_web_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d miru_web_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest

      - name: Setup test database
        run: bundle exec rails db:test:prepare

      # With one group selected, parallel_rspec runs it as its first process,
      # with an empty TEST_ENV_NUMBER, so it uses the database prepared above.
      - name: Run handoff specs
        run: bundle exec parallel_rspec spec/lib/timekeeping/handoff -n 3 --only-group ${{ matrix.group }}

  # Matrix legs report under their own names, so this job carries the single
  # Timekeeping handoff specs check. always() makes it run, and fail, when a leg
  # fails or is cancelled; without it the job would be skipped instead.
  timekeeping-handoff-result:
    name: Timekeeping handoff specs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: timekeeping-handoff
    if: always() && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci'))
    steps:
      - name: Require every handoff spec group to pass
        env:
          HANDOFF_RESULT: ${{ needs.timekeeping-handoff.result }}
        run: test "$HANDOFF_RESULT" = success

  responsive-system-specs:
    name: Responsive system specs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: root
      DB_PASS: password
      CI: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: miru_web_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d miru_web_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Install web packages
        run: PUPPETEER_SKIP_DOWNLOAD=true pnpm install --frozen-lockfile

      - name: Install mobile packages
        run: pnpm --dir apps/mobile install --frozen-lockfile

      - name: Typecheck mobile app
        run: pnpm mobile:typecheck

      - name: Build Vite assets
        env:
          SECRET_KEY_BASE: dummy
        run: timeout 180 bin/vite build

      - name: Install Chrome for Cuprite
        uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 # v2
        id: setup-chrome

      - name: Setup test database
        run: bundle exec rails db:test:prepare

      - name: Run responsive system specs
        env:
          FERRUM_BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bundle exec rspec spec/system/responsive

  # The rules gem runs from its own bundle, without Rails or Postgres, so a
  # passing run proves the gem does not depend on the app.
  timekeeping-rules:
    name: Timekeeping rules gem specs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    defaults:
      run:
        working-directory: gems/timekeeping_rules
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest
          working-directory: gems/timekeeping_rules

      - name: Run gem specs
        run: bundle exec rspec

  # The shared snapshot relay. Its specs load the monolith's fake projection
  # endpoint from spec/support/timekeeping and the contract from contracts/, so
  # the checkout must be the whole repository.
  timekeeping-relay:
    name: Timekeeping relay gem specs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    defaults:
      run:
        working-directory: gems/timekeeping_relay
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest
          working-directory: gems/timekeeping_relay

      - name: Run gem specs
        run: bundle exec rspec

  # The Timekeeping service runs from its own bundle against its own database.
  # Only TIMEKEEPING_DATABASE_URL is set, and no DATABASE_URL, so a passing run
  # shows the service needs no monolith database setting.
  timekeeping:
    name: Timekeeping service specs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    env:
      RAILS_ENV: test
      TIMEKEEPING_DATABASE_URL: postgres://root:password@localhost:5432/timekeeping_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: timekeeping_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d timekeeping_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: timekeeping
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest
          working-directory: timekeeping

      - name: Prepare database
        run: bundle exec rails db:prepare

      - name: Run service specs
        run: bundle exec rspec

  # Boots a real Timekeeping server from its own bundle and database, makes
  # real entry writes through it, and runs the monolith's timekeeping:alerts
  # task against its metrics endpoint. The spec starts and stops the server.
  timekeeping-alerts-live:
    name: Timekeeping alerts against a live service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: root
      DB_PASS: password
      CI: true
      TIMEKEEPING_LIVE: "1"
      # The live specs render no pages, so they need no Vite build (and this job installs no Node).
      SKIP_VITE_TEST_BUILD: "1"
      TIMEKEEPING_DATABASE_URL: postgres://root:password@localhost:5432/timekeeping_live_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: miru_web_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d miru_web_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby for the monolith
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest

      - name: Install the Timekeeping bundle
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest
          working-directory: timekeeping

      - name: Setup monolith test database
        run: bundle exec rails db:test:prepare

      - name: Run live alert specs
        run: bundle exec rspec spec/integration/timekeeping/alerts_live_spec.rb

  # Starts the local demo runtime with bin/timekeeping-demo up against the
  # seeded database, and fails if a job from default or any other queue
  # outside the dedicated ones runs. The launcher refuses to start when both
  # applications would connect as one database user, so Timekeeping gets a
  # role of its own here.
  #
  # The same job also runs the Timekeeping queue collector against real
  # completed, claimed and failed Solid Queue rows in the Timekeeping test
  # database, and boots the runtime from a temporary tree whose dotenv file
  # sets conflicting database settings, to check that each app still connects
  # as its own database user. Every other job leaves TIMEKEEPING_LIVE unset or
  # does not name these specs, so they skip or do not run there.
  timekeeping-runtime-live:
    name: Timekeeping demo runtime starts only the dedicated workers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'skip ci')
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: root
      DB_PASS: password
      CI: true
      TIMEKEEPING_LIVE: "1"
      # The runtime spec renders no pages, so it needs no Vite build (and this job installs no Node).
      SKIP_VITE_TEST_BUILD: "1"
      TIMEKEEPING_DATABASE_URL: postgres://timekeeping_runtime:timekeeping_runtime@localhost:5432/timekeeping_runtime_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: miru_web_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root -d miru_web_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby for the monolith
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest

      - name: Install the Timekeeping bundle
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest
          working-directory: timekeeping

      - name: Create the Timekeeping database role
        env:
          PGPASSWORD: password
        run: psql -h localhost -U root -d miru_web_test -c "CREATE ROLE timekeeping_runtime LOGIN CREATEDB PASSWORD 'timekeeping_runtime'"

      - name: Setup monolith test database
        run: bundle exec rails db:test:prepare

      - name: Run the demo runtime queue spec, the Timekeeping collector row spec and the boot database isolation spec
        run: >-
          bundle exec rspec
          spec/timekeeping/runtime_queues_spec.rb
          spec/timekeeping/timekeeping_collector_rows_spec.rb
          spec/lib/timekeeping_demo/boot_database_isolation_live_spec.rb

  security-audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true
          bundler: latest

      - name: Run bundler-audit
        run: |
          gem install bundler-audit --no-document
          bundler-audit check --update
          bundler-audit check timekeeping

      - name: Run brakeman
        run: |
          bundle exec brakeman -q -w2
